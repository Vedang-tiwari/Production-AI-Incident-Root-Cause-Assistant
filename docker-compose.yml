version: '3.8'

services:
  incident-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-assistant-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/incident_db
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - DEBUG=False
      - LLM_PROVIDER=mock_fallback
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: incident-assistant-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=incident_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: incident-assistant-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:

